<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Shipment Lost Its Route | Stackly</title>

    <meta name="description" content="Page not found.">

    <link rel="icon" type="image/svg+xml" href="svg/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Your existing Stackly CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/mobile.css">

    <style>

        /* =========================================================
           STACKLY 404 PAGE
        ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #f7f4ee;
            color: #111;
        }

        .sl-404 {
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            background: #f7f4ee;

            overflow: hidden;
        }

        .sl-404-inner {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }


        /* =========================================================
           404 NUMBER
        ========================================================= */

        .sl-404-code {
            position: relative;

            display: inline-block;

            font-size: clamp(110px, 20vw, 230px);

            line-height: .85;

            font-weight: 800;

            letter-spacing: -10px;

            color: #111;

            margin-bottom: 35px;
        }

        .sl-404-code b {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;

            color: #c8892f;

            font-weight: 800;

            pointer-events: none;
        }


        /* =========================================================
           HEADING
        ========================================================= */

        .sl-404 h1 {
            margin: 0 auto 18px;

            max-width: 700px;

            font-size: clamp(30px, 5vw, 58px);

            line-height: 1.05;

            letter-spacing: -1.5px;

            font-weight: 800;
        }


        /* =========================================================
           DESCRIPTION
        ========================================================= */

        .sl-404 p {
            max-width: 620px;

            margin: 0 auto 32px;

            font-size: 17px;

            line-height: 1.7;

            color: rgba(17, 17, 17, .68);
        }


        /* =========================================================
           BUTTONS
        ========================================================= */

        .sl-404-btns {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .sl-btn {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            min-height: 50px;

            padding: 0 24px;

            border-radius: 999px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            border: 1px solid transparent;

            transition:
                transform .25s ease,
                background .25s ease,
                color .25s ease,
                border-color .25s ease;
        }

        .sl-btn:hover {
            transform: translateY(-2px);
        }


        /* HOME BUTTON */

        .sl-btn-primary {
            background: #111;

            color: #fff;
        }

        .sl-btn-primary:hover {
            background: #c8892f;

            color: #fff;
        }


        /* GO BACK BUTTON */

        .sl-btn-ghost {
            background: transparent;

            color: #111;

            border-color: rgba(17, 17, 17, .2);
        }

        .sl-btn-ghost:hover {
            background: #111;

            color: #fff;
        }


        /* =========================================================
           ROAD
        ========================================================= */

        .sl-404-road {
            display: block;

            width: min(560px, 100%);

            height: auto;

            margin: 45px auto 0;
        }


        /* =========================================================
           TRUCK
        ========================================================= */

        .sl-404-truck {
            animation: slTruckMove 5s linear infinite;
        }

        @keyframes slTruckMove {

            0% {
                transform: translate(10px, 105px);
            }

            50% {
                transform: translate(285px, 20px);
            }

            100% {
                transform: translate(540px, 100px);
            }

        }


        /* =========================================================
           CONTENT ANIMATION
        ========================================================= */

        .sl-404-code {
            animation: sl404Code 1s ease forwards;
        }

        .sl-404 h1,
        .sl-404 p,
        .sl-404-btns,
        .sl-404-road {
            opacity: 0;

            animation: sl404Content .8s
                cubic-bezier(.22, 1, .36, 1)
                forwards;
        }

        .sl-404 h1 {
            animation-delay: .15s;
        }

        .sl-404 p {
            animation-delay: .25s;
        }

        .sl-404-btns {
            animation-delay: .35s;
        }

        .sl-404-road {
            animation-delay: .45s;
        }

        @keyframes sl404Code {

            from {
                opacity: 0;

                transform: translateY(20px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }

        @keyframes sl404Content {

            from {
                opacity: 0;

                transform: translateY(30px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 600px) {

            .sl-404 {
                padding: 30px 18px;
            }

            .sl-404-code {
                font-size: 110px;

                letter-spacing: -6px;

                margin-bottom: 28px;
            }

            .sl-404 h1 {
                font-size: 32px;

                letter-spacing: -1px;
            }

            .sl-404 p {
                font-size: 15px;

                line-height: 1.6;

                margin-bottom: 26px;
            }

            .sl-404-btns {
                flex-direction: column;

                width: 100%;
            }

            .sl-btn {
                width: min(280px, 100%);
            }

            .sl-404-road {
                margin-top: 35px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================================
         404 CONTENT
    ========================================================= -->

    <main class="sl-404">

        <div class="sl-404-inner">


            <!-- 404 NUMBER -->

            <div
                class="sl-404-code"
                aria-hidden="true"
            >
                404

                <b>404</b>
            </div>


            <!-- HEADING -->

            <h1>
                Looks like this shipment lost its route.
            </h1>


            <!-- DESCRIPTION -->

            <p>
                The page you requested missed its transshipment window.
                Let’s reroute you back to familiar territory.
            </p>


            <!-- BUTTONS -->

            <div class="sl-404-btns">


                <!-- HOME -->

                <a
                    href="index.html"
                    class="sl-btn sl-btn-primary"
                >

                    Back Home

                    <svg
                        width="18"
                        height="18"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M5 12h14"></path>

                        <path d="M13 6l6 6-6 6"></path>

                    </svg>

                </a>


                <!-- GO BACK -->

                <a
                    href="#"
                    class="sl-btn sl-btn-ghost"
                    id="goBackBtn"
                >
                    Go Back
                </a>

            </div>


            <!-- ROAD ANIMATION -->

            <svg
                class="sl-404-road"
                viewBox="0 0 560 130"
                fill="none"
                aria-hidden="true"
            >

                <!-- Road -->

                <path
                    d="M10 105 C150 105, 190 20, 300 20 S480 100, 550 100"
                    stroke="rgba(17,17,17,.18)"
                    stroke-width="2"
                    stroke-dasharray="8 8"
                />


                <!-- Truck -->

                <g class="sl-404-truck">

                    <rect
                        x="-16"
                        y="-12"
                        width="22"
                        height="14"
                        rx="3"
                        fill="#C8892F"
                    />

                    <rect
                        x="6"
                        y="-9"
                        width="10"
                        height="11"
                        rx="2"
                        fill="#111"
                    />

                    <circle
                        cx="-9"
                        cy="4"
                        r="3.4"
                        fill="#111"
                    />

                    <circle
                        cx="9"
                        cy="4"
                        r="3.4"
                        fill="#111"
                    />

                    <circle
                        cx="-9"
                        cy="4"
                        r="1.3"
                        fill="#F7F4EE"
                    />

                    <circle
                        cx="9"
                        cy="4"
                        r="1.3"
                        fill="#F7F4EE"
                    />

                </g>


                <!-- Location marker -->

                <g transform="translate(90,34)">

                    <path
                        d="M0 10 C0 4 4 0 10 0 S20 4 20 10 10 26 10 26 0 16 0 10Z"
                        fill="#C8892F"
                    />

                    <circle
                        cx="10"
                        cy="10"
                        r="4"
                        fill="#fff"
                    />

                </g>


                <!-- Second marker -->

                <g transform="translate(430,86)">

                    <path
                        d="M0 10 C0 4 4 0 10 0 S20 4 20 10 10 26 10 26 0 16 0 10Z"
                        fill="#111"
                    />

                    <circle
                        cx="10"
                        cy="10"
                        r="4"
                        fill="#fff"
                    />

                </g>

            </svg>

        </div>

    </main>


    <!-- =========================================================
         GO BACK + SECTION RESTORE
    ========================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const goBackBtn =
                    document.getElementById("goBackBtn");


                if (!goBackBtn) {
                    return;
                }


                goBackBtn.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        /*
                         * Retrieve the page that the user
                         * came from.
                         */

                        const previousPage =
                            sessionStorage.getItem(
                                "stacklyPreviousPage"
                            );


                        /*
                         * Retrieve the section that the
                         * user came from.
                         */

                        const previousSection =
                            sessionStorage.getItem(
                                "stacklyPreviousSection"
                            );


                        /*
                         * If both page and section exist,
                         * restore the exact location.
                         */

                        if (
                            previousPage &&
                            previousSection
                        ) {

                            window.location.href =
                                previousPage +
                                "#" +
                                previousSection;

                            return;
                        }


                        /*
                         * If only the page exists.
                         */

                        if (previousPage) {

                            window.location.href =
                                previousPage;

                            return;
                        }


                        /*
                         * Fallback to browser history.
                         */

                        if (
                            window.history.length > 1
                        ) {

                            window.history.back();

                            return;
                        }


                        /*
                         * Final fallback.
                         */

                        window.location.href =
                            "index.html";

                    }
                );

            }
        );

    </script>


</body>

</html>
